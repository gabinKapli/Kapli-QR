<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kapli-QR</title>
        <script src="https://unpkg.com/html5-qrcode"></script>

        <style>
            :root {
                --radius-lg: 12px;
                --radius-md: 10px;
                --radius-sm: 8px;
                --bg: #ffffff;
                --bg-muted: #f3f3f3;
                --text: #111111;
                --text-muted: #666666;
                --border: #cccccc;
                --overlay: rgba(0, 0, 0, 0.6);
                --danger: #b00020;
                --success: #137333;
            }

            body {
                margin: 0;
                padding: 20px;
                font-family: system-ui, sans-serif;
            }

            #reader {
                width: min(512px, 100%);
                margin: 0 auto;
                border-radius: var(--radius-lg);
                overflow: hidden;
            }

            #reader video {
                border-radius: var(--radius-md);
                width: 100%;
            }

            #overlay {
                position: fixed;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                background: var(--overlay);
                z-index: 9999;
            }

            #overlayCard {
                background: var(--bg);
                padding: 20px;
                border-radius: var(--radius-lg);
                width: min(90vw, 400px);
                text-align: center;
            }

            #overlayTitle {
                font-weight: 700;
            }

            #overlayData {
                margin: 15px 0;
                padding: 12px;
                background: var(--bg-muted);
                border-radius: var(--radius-sm);
                word-break: break-all;
                font-family: monospace;
            }

            #overlayActions {
                display: flex;
                gap: 10px;
            }

            button {
                flex: 1;
                padding: 12px;
                border-radius: var(--radius-sm);
                cursor: pointer;
                font-size: 16px;
                border: 1px solid var(--border);
            }

            #confirmBtn {
                background: var(--text);
                color: var(--bg);
                border: none;
            }

            #cancelBtn {
                background: var(--bg-muted);
            }

            #status {
                margin-top: 12px;
                color: var(--text-muted);
                font-size: 14px;
            }

            #status.error {
                color: var(--danger);
            }

            #status.success {
                color: var(--success);
            }

            #fallbackLink {
                display: none;
                margin-top: 12px;
                color: var(--text);
                font-weight: 600;
            }
        </style>
    </head>

    <body>
        <div id="reader"></div>

        <div id="overlay">
            <div id="overlayCard">
                <div id="overlayTitle">Produit detecte</div>
                <div id="overlayData">-</div>
                <div id="overlayActions">
                    <button id="confirmBtn" type="button">Ouvrir la fiche</button>
                    <button id="cancelBtn" type="button">Annuler</button>
                </div>
                <a id="fallbackLink" href="#" target="_top" rel="noreferrer">Ouvrir manuellement</a>
                <div id="status">Scan pret</div>
            </div>
        </div>

        <script>
            const overlay = document.getElementById("overlay");
            const overlayData = document.getElementById("overlayData");
            const confirmBtn = document.getElementById("confirmBtn");
            const cancelBtn = document.getElementById("cancelBtn");
            const fallbackLink = document.getElementById("fallbackLink");
            const statusEl = document.getElementById("status");

            const urlParams = new URLSearchParams(window.location.search);
            const detailPath = "d83f52/r/";
            const confirmEnabled = !["0", "false", "no"].includes(
                urlParams.get("confirm")?.toLowerCase()
            );

            const html5QrCode = new Html5Qrcode("reader");
            let lastDecodedText = null;
            let isBusy = false;

            function setStatus(message, type = "") {
                statusEl.textContent = message;
                statusEl.className = type;
            }

            function getGlideRootFromUrl(value) {
                if (!value) return null;

                try {
                    const url = new URL(value);
                    const match = url.pathname.match(/^(\/dl\/[^/]+\/s\/)/);

                    if (!match) return null;

                    return `${url.origin}${match[1]}`;
                } catch (error) {
                    return null;
                }
            }

            function getDetailBaseUrl() {
                const manualBaseUrl = urlParams.get("base");

                if (manualBaseUrl) {
                    try {
                        const manualGlideRoot = getGlideRootFromUrl(manualBaseUrl);
                        const manualRoot = manualGlideRoot || new URL(manualBaseUrl).toString();

                        return `${manualRoot.replace(/\/$/, "")}/${detailPath}`;
                    } catch (error) {
                        return null;
                    }
                }

                const glideRoot =
                    getGlideRootFromUrl(urlParams.get("source")) ||
                    getGlideRootFromUrl(document.referrer) ||
                    getGlideRootFromUrl(window.location.href);

                if (!glideRoot) return null;

                return `${glideRoot}${detailPath}`;
            }

            function getTargetUrl(scannedText) {
                const cleanText = String(scannedText || "").trim();

                if (!cleanText) {
                    return null;
                }

                try {
                    const scannedUrl = new URL(cleanText);

                    if (!["http:", "https:"].includes(scannedUrl.protocol)) {
                        return null;
                    }

                    return scannedUrl.toString();
                } catch (error) {
                    try {
                        const baseUrl = getDetailBaseUrl();

                        if (!baseUrl) {
                            return null;
                        }

                        const targetUrl = new URL(encodeURIComponent(cleanText), baseUrl);

                        if (!["http:", "https:"].includes(targetUrl.protocol)) {
                            return null;
                        }

                        return targetUrl.toString();
                    } catch (innerError) {
                        return null;
                    }
                }
            }

            function openInGlideApp(scannedText) {
                const targetUrl = getTargetUrl(scannedText);

                if (!targetUrl) {
                    setStatus("Impossible de construire l'URL Glide.", "error");
                    return false;
                }

                fallbackLink.href = targetUrl;
                fallbackLink.style.display = "inline-block";
                setStatus("Ouverture de la fiche...", "success");
                window.open(targetUrl, "_top");
                return true;
            }

            function showOverlay(text) {
                lastDecodedText = text;
                overlayData.textContent = text;
                fallbackLink.style.display = "none";
                fallbackLink.removeAttribute("href");
                overlay.style.display = "flex";
                setStatus("Pret a ouvrir dans Glide.");
                html5QrCode.pause(true);
            }

            function hideOverlay() {
                overlay.style.display = "none";
                fallbackLink.style.display = "none";
                fallbackLink.removeAttribute("href");
                lastDecodedText = null;
            }

            async function resumeScanning() {
                try {
                    await html5QrCode.resume();
                } catch (error) {
                    startScanning();
                }
            }

            async function startScanning() {
                try {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        (decodedText) => {
                            if (isBusy) return;
                            isBusy = true;

                            if (confirmEnabled) {
                                showOverlay(decodedText);
                            } else {
                                const opened = openInGlideApp(decodedText);

                                if (!opened) {
                                    isBusy = false;
                                    resumeScanning();
                                }
                            }
                        },
                        () => {}
                    );
                } catch (error) {
                    setStatus("Camera non disponible.", "error");
                }
            }

            confirmBtn.addEventListener("click", () => {
                if (lastDecodedText) {
                    openInGlideApp(lastDecodedText);
                }
            });

            cancelBtn.addEventListener("click", () => {
                hideOverlay();
                isBusy = false;
                resumeScanning();
            });

            startScanning();
        </script>
    </body>
</html>
